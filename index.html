<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ai Studio By Mr Hassnain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <style>
      :root {
        --bg-color: #f8fafc; /* slate-50 */
        --text-color: #1e293b; /* slate-800 */
        --blob1-color: rgba(34, 211, 238, 0.15); /* cyan-400 */
        --blob2-color: rgba(59, 130, 246, 0.15); /* blue-500 */
        --scrollbar-track: #e2e8f0; /* slate-200 */
        --scrollbar-thumb: #22d3ee; /* cyan-400 */
        --scrollbar-thumb-hover: #06b6d4; /* cyan-500 */
      }

      html.dark {
        --bg-color: #0b1120;
        --text-color: #d1d5db; /* gray-300 */
        --blob1-color: rgba(34, 211, 238, 0.2);
        --blob2-color: rgba(59, 130, 246, 0.2);
        --scrollbar-track: #172134;
        --scrollbar-thumb: #22d3ee; /* cyan-400 */
        --scrollbar-thumb-hover: #06b6d4; /* cyan-500 */
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        overflow-x: hidden;
        position: relative;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      /* Blurred blobs for background effect */
      body::before, body::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        z-index: -1;
        opacity: 0.7;
        transition: background 0.5s ease;
      }
      body::before {
        width: 350px;
        height: 350px;
        background: radial-gradient(circle, var(--blob1-color), transparent 70%);
        top: 5%;
        right: 10%;
      }
      body::after {
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, var(--blob2-color), transparent 70%);
        bottom: 5%;
        left: 10%;
      }

      /* Custom scrollbar for a cleaner look */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--scrollbar-track); 
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--scrollbar-thumb-hover);
      }
      
      .animated-title-gradient {
        background: linear-gradient(
          to right, 
          var(--text-color) 20%, 
          #22d3ee 40%, 
          #3b82f6 60%, 
          var(--text-color) 80%
        );
        background-size: 200% auto;
        
        background-clip: text;
        -webkit-background-clip: text;
        
        -webkit-text-fill-color: transparent;
        animation: shine 6s linear infinite;
      }

      @keyframes shine {
        to {
          background-position: -200% center;
        }
      }

      .gradient-button {
        background-image: linear-gradient(to right, #22d3ee, #3b82f6);
      }
      .gradient-button:hover {
        background-image: linear-gradient(to right, #06b6d4, #2563eb);
      }
    </style>
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
